<div class="auth-page">
  <div class="auth-card">
    <h1>Check your email</h1>
    <p class="auth-subtitle">
      We've sent a verification link to your email address. Click the link to verify your account.
    </p>
    @if (resent()) {
      <p class="success-msg">Verification email sent! Check your inbox.</p>
    }
    @if (error()) {
      <p class="error-msg">{{ error() }}</p>
    }
    <button
      class="btn btn-primary btn-full"
      [disabled]="resending()"
      (click)="resend()">
      {{ resending() ? 'Sending...' : 'Resend email' }}
    </button>
    <a class="btn btn-secondary btn-full" routerLink="/">Go to home</a>
  </div>
</div>
