name: Deploy API

on:
  push:
    branches: [development]
    paths:
      - 'apps/api/**'
      - 'packages/shared/**'
      - '.github/workflows/deploy-api.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run test:api

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    # Uncomment and configure for your AWS environment:
    # environment: development
